AWSTemplateFormatVersion: "2010-09-09"
Description: Serverless model-serving stack for the PhishGuard network-security backend (API Gateway HTTP API + Lambda + private S3 model registry).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev
  BucketName:
    Type: String
    Default: networksecurity-model-registry
  LambdaImageUri:
    Type: String
    Description: ECR image URI for the inference Lambda container.
  ModelVersion:
    Type: String
    Default: ""
    Description: Pinned model version to serve (e.g. v13). Empty follows the production manifest.
  MongodbUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: Connection string for the feedback database.
  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional shared secret checked against the X-API-Key header.
  LambdaMemoryMb:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 10240
  LambdaTimeoutSec:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900

Resources:
  ModelRegistryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  InferenceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ModelRegistryRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/models/*"
                  - !Sub "arn:aws:s3:::${BucketName}/production/*"

  InferenceLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/network-security-inference-${Environment}"
      RetentionInDays: 14

  InferenceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "network-security-inference-${Environment}"
      Role: !GetAtt InferenceLambdaRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref LambdaImageUri
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref LambdaTimeoutSec
      Environment:
        Variables:
          PHISHGUARD_MODEL_BUCKET: !Ref BucketName
          PHISHGUARD_MODEL_VERSION: !Ref ModelVersion
          PHISHGUARD_API_KEY: !Ref ApiKey
          MONGODB_URL: !Ref MongodbUrl
          PHISHGUARD_MODEL_CACHE_DIR: /tmp/phishguard-models
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref InferenceLambdaLogGroup

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "network-security-api-${Environment}"
      ProtocolType: HTTP
      Description: HTTP API for the PhishGuard inference backend

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt InferenceLambda.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  HttpApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref InferenceLambda
      Principal: apigateway.amazonaws.com

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${LambdaIntegration}"

  PredictUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /predict_url"
      Target: !Sub "integrations/${LambdaIntegration}"

  PredictUrlsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /predict_urls"
      Target: !Sub "integrations/${LambdaIntegration}"

  AnalyzeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/v1/analyze"
      Target: !Sub "integrations/${LambdaIntegration}"

  FeedbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /feedback"
      Target: !Sub "integrations/${LambdaIntegration}"

  ApiFeedbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/v1/feedback"
      Target: !Sub "integrations/${LambdaIntegration}"

  ModelVersionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/v1/model/version"
      Target: !Sub "integrations/${LambdaIntegration}"

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${LambdaIntegration}"

Outputs:
  ApiEndpoint:
    Description: HTTPS base URL for the inference API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  LambdaFunctionName:
    Description: Name of the inference Lambda function
    Value: !Ref InferenceLambda
  ModelRegistryBucket:
    Description: Private S3 model registry bucket
    Value: !Ref ModelRegistryBucket
  ProductionManifestKey:
    Description: Production manifest object key (source of truth for model selection)
    Value: "production/manifest.json"
