name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_scorer requires trained models that live in S3, not in the repo,
      # so it is excluded from the CI suite (run it locally after training).
      - name: Run tests
        run: python -m pytest tests -q -k "not scorer"
